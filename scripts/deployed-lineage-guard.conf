# TON-1129 - the deployed-tree lineage PIN, as a versioned artifact.
#
# WHY THIS FILE EXISTS
#   The pin used to live ONLY in the deployed tree's local git config
#   (branch.<name>.remote / branch.<name>.merge). Local config is not an
#   artifact: it is invisible to `git log`, it is not carried by a clone,
#   and it is silently dropped whenever someone creates a branch from a
#   LOCAL branch (`git checkout -b` from a local branch inherits no
#   upstream unless the start point is a remote-tracking branch).
#
#   That is exactly how the pin broke on 2026-11-04: the deployed tree was
#   moved to `ton/ton-1112-queued-run-age-bound` (cut from the local
#   `master`), the branch ended up with upstream=none, and the guard then
#   failed closed - refusing every redeploy - with the pin invisible in the
#   repository.
#
#   The invariant is now committed here, on the durable branch, so it is
#   reviewable, cloneable, and diffable. The guard and the repair script
#   both read it; environment variables still override it.
#
# KEY=VALUE, one per line, no shell expansion. Read by:
#   scripts/deployed-lineage-guard.sh    (the detector)
#   scripts/repin-deployed-lineage.sh    (the repair)

# The branch on the fork that carries the deployed lineage.
DEPLOYED_DURABLE_BRANCH=ton/deployed-long-active-fix

# The name the fork remote has in the deployed tree. The guard asserts the
# remote's URL, not its name - a clone that calls the fork `origin` is
# judged on the same merits - so this is the EXPECTED name, not the
# invariant.
DEPLOYED_DURABLE_REMOTE=fork

# URL patterns that identify the right and the wrong repository.
DEPLOYED_DURABLE_URL_PATTERN=tonytouch/paperclip
DEPLOYED_FORBIDDEN_URL_PATTERN=paperclipai/paperclip

# The commit whose presence defines "the deployed lineage is intact".
DEPLOYED_FIX_COMMIT=fa3c22dd14a2502ed055ef6e7c309478ff7d5346

# The service (and its test) that upstream deleted and that must survive.
DEPLOYED_SERVICE=server/src/services/productivity-review.ts
DEPLOYED_TESTFILE=server/src/__tests__/productivity-review-service.test.ts
DEPLOYED_MARKER=findLiveContinuationPath
